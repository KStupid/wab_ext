<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WAB Ext</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h1>Send WhatsApp Message</h1>
    <button type="button" id="closeBtn" class="close-button">Close</button>

    <label for="phone">Phone Numbers</label>
    <input type="text" id="phone" value="9495342265" placeholder="e.g., 9495342265, 918888888888" aria-required="true">
    <!-- <p style="margin-top:5px; font-size:12px; color:#666;">Separate numbers with commas. Example: 9495342265, 7736592394</p>
    -->
    <label for="message">Message:</label>
    <textarea id="message" rows="4" placeholder="Type your message here..." aria-required="true">hello</textarea>

    <button id="sendBtn" class="send-button">Send Message</button>

    <p id="status" aria-live="polite"></p>
    <script src="cbutton.js"></script>
    <script src="popup.js"></script>
</body>

</html>
