<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WAB Ext</title>
  <style>
    body { width: 280px; padding: 15px; font-family: sans-serif; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, textarea { width: 100%; margin-top: 5px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; margin-top: 15px; padding: 12px; background-color: #25D366; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #128C7E; }
    #status { margin-top: 15px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <h3>Send WhatsApp Message</h3>
  
  <label for="phone">Phone Numbers</label>
  <input type="text" id="phone" value="9495342265" placeholder="e.g., 9495342265, 918888888888" aria-required="true">
  <p style="margin-top:5px; font-size:12px; color:#666;">Separate numbers with commas. Example: 9495342265, 7736592394</p>
  
  <label for="message">Message:</label>
  <textarea id="message" rows="4" placeholder="Type your message here..." aria-required="true">hello</textarea>
  
  <button id="sendBtn">Send Message</button>
  
  <p id="status" aria-live="polite"></p>
  
  <script src="popup.js"></script>
</body>
</html>
